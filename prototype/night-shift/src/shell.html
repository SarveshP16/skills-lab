<title>Night Shift Ops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a night-shift operations console. Ticket queue | ticket briefing | live terminal.
   One deliberate dark look: blue-black night, sodium-streetlight orange for the one accent,
   track colours (network blue, security rose, devops violet) used only to encode which track a ticket belongs to. */
:root{
  --night:#0b1220; --panel:#111a2a; --panel-2:#172236; --rule:#24314a; --rule-2:#2f3e5b;
  --text:#dbe3ef; --dim:#8e9bb2; --faint:#5e6b84;
  --sodium:#ffad4f; --sodium-ink:#2b1903; --sodium-soft:rgba(255,173,79,.12);
  --ok:#5fd6a1; --ok-soft:rgba(95,214,161,.12); --bad:#ff7380; --bad-soft:rgba(255,115,128,.12);
  --term:#060b14; --term-text:#cdd7e5;
  --net:#7db6ff; --sec:#ff8f9d; --ops:#bca7ff;
  --f-display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
code,kbd{font-family:var(--f-mono);font-size:.88em}
:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}

#app{height:100%;display:grid;gap:12px;
  grid-template-columns:288px minmax(0,1fr) minmax(0,1.12fr);
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "queue brief term";
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar */
.top{grid-area:top;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 22px/1 var(--f-display);letter-spacing:-.01em}
.brand b span{color:var(--sodium)}
.brand small{color:var(--dim);font-size:13px;white-space:nowrap}
.shift{font:500 13px var(--f-mono);color:var(--dim);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.shift .lamp{width:8px;height:8px;border-radius:50%;background:var(--sodium);box-shadow:0 0 10px var(--sodium)}
.rank{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.rank-name{font:700 14px var(--f-display);white-space:nowrap}
.rank-next{color:var(--dim);font-size:12px;white-space:nowrap}
.xpbar{width:150px;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--sodium);transition:width .6s ease}
.xp{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--sodium);white-space:nowrap}
.queue-btn{display:none;border:1px solid var(--rule-2);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}

/* ---------- queue */
.queue{grid-area:queue;overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 10px 18px}
.queue h2{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:0 6px 10px}
.track{margin-bottom:16px}
.track-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 6px 6px;gap:8px}
.track-head b{font:700 15px var(--f-display)}
.track-head span{font:500 12px var(--f-mono);color:var(--dim)}
.track[data-t=net] .track-head b{color:var(--net)}
.track[data-t=sec] .track-head b{color:var(--sec)}
.track[data-t=ops] .track-head b{color:var(--ops)}
.tk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:7px 8px;cursor:pointer}
.tk:hover{background:var(--panel-2)}
.tk[aria-current=true]{background:var(--panel-2);border-color:var(--rule-2)}
.tk .code{font:500 11px var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
.tk .t{font-size:14px;line-height:1.3;min-width:0}
.tk .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rule-2);display:grid;place-items:center;font-size:11px}
.tk.done .st{background:var(--ok);border-color:var(--ok);color:var(--night);font-weight:700}
.tk.active .st{border-color:var(--sodium)}
.tk.active .st::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--sodium)}
.queue-foot{margin:18px 6px 0;color:var(--faint);font-size:12px;line-height:1.5}
.queue-foot button{background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}

/* ---------- briefing */
.brief{grid-area:brief;overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:12px;min-width:0}
.brief-in{padding:22px 24px 40px;display:flex;flex-direction:column;gap:22px;max-width:760px}
.tk-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:500 12px var(--f-mono);color:var(--dim)}
.chip{padding:2px 8px;border-radius:999px;border:1px solid currentColor;font:600 11px var(--f-mono);letter-spacing:.04em}
.chip.net{color:var(--net)} .chip.sec{color:var(--sec)} .chip.ops{color:var(--ops)}
.brief h1{font:800 clamp(24px,2.6vw,32px)/1.08 var(--f-display);letter-spacing:-.015em;margin:8px 0 0;text-wrap:balance}
.req{border-left:2px solid var(--sodium);padding:4px 0 4px 14px;color:var(--text)}
.req .from{font:500 12px var(--f-mono);color:var(--sodium);margin-bottom:4px}
.req p{margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h3{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:0}
.sec-h span{font:500 12px var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
.obj{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.obj li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:8px;background:var(--panel-2)}
.obj li .box{width:18px;height:18px;margin-top:2px;border-radius:5px;border:1.5px solid var(--rule-2);display:grid;place-items:center;font-size:12px;font-weight:700}
.obj li.done{background:var(--ok-soft)}
.obj li.done .box{background:var(--ok);border-color:var(--ok);color:var(--night)}
.obj li.done .txt{color:var(--dim)}
.obj li.next{outline:1px solid var(--rule-2)}
.obj .txt{min-width:0;overflow-wrap:anywhere}
.obj code,.prose code,.hint code{background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;color:var(--text)}
.submit-note{font-size:13px;color:var(--dim);margin-top:8px}
.prose{max-width:66ch}
.prose p{margin:0 0 .8em}
.prose p:last-child{margin-bottom:0}
.prose strong{color:#fff;font-weight:600}
.diagram{margin:0;background:var(--term);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;overflow-x:auto;font:12.5px/1.45 var(--f-mono);color:var(--term-text);white-space:pre}
.tbl-wrap{overflow-x:auto}
table.cmds{border-collapse:collapse;width:100%;font-size:14px}
table.cmds td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.cmds td:first-child{white-space:nowrap;font:500 13px var(--f-mono);color:var(--sodium);padding-right:16px}
.btn{border:1px solid var(--rule-2);background:var(--panel-2);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--sodium);color:var(--sodium-ink);border-color:var(--sodium);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--sodium-soft);border:1px solid rgba(255,173,79,.3);border-radius:8px;padding:8px 12px;font-size:14px}
.hint b{color:var(--sodium);font:600 11px var(--f-mono);margin-right:6px}
.resolved{border:1px solid rgba(95,214,161,.4);background:var(--ok-soft);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.resolved>h3{margin:0;font:800 20px var(--f-display);color:var(--ok)}
.resolved .xpline{font:500 13px var(--f-mono);color:var(--dim)}
.quiz{display:flex;flex-direction:column;gap:16px}
.q p{margin:0 0 8px;font-weight:500}
.q .opts{display:grid;gap:6px}
.q button{text-align:left;padding:8px 12px;border-radius:8px;border:1px solid var(--rule-2);background:var(--panel-2);cursor:pointer;font-size:14px}
.q button:hover:not(:disabled){border-color:var(--dim)}
.q button:disabled{cursor:default}
.q button.right{border-color:var(--ok);background:var(--ok-soft)}
.q button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .why{margin-top:8px;font-size:14px;color:var(--dim)}

/* ---------- terminal */
.term{grid-area:term;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--term);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);background:#0a111d}
.term-bar .host{font:500 12.5px var(--f-mono);color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-bar .btn{padding:4px 10px;font-size:12px}
.out{flex:1;overflow:auto;padding:12px 14px 16px;font:13.5px/1.5 var(--f-mono);color:var(--term-text);cursor:text;overflow-wrap:anywhere}
.out .ln{white-space:pre-wrap;min-height:1.5em}
.out .err{color:#ff9aa4}
.out .coach{color:var(--sodium)}
.out .sys{color:var(--dim)}
.out .cmdline .p{color:var(--ok)}
.out .cmdline .p .path{color:var(--net)}
.a1{font-weight:700}.a2{opacity:.65}.a31{color:#ff8b95}.a32{color:#6fe0ac}.a33{color:#ffc46b}.a34{color:#82b8ff}.a35{color:#d4a5ff}.a36{color:#6fd8e6}.a90{color:var(--faint)}
.inrow{display:flex;gap:0;align-items:baseline}
.inrow label{white-space:pre;color:var(--ok)}
.inrow label .path{color:var(--net)}
.inrow input{flex:1;min-width:40px;background:transparent;border:0;outline:0;color:var(--term-text);font:13.5px/1.5 var(--f-mono);padding:0;caret-color:var(--sodium)}
.inrow input:disabled{opacity:.4}

/* ---------- editor (nano) */
.editor{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.7);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ed{width:min(860px,100%);height:min(620px,100%);display:flex;flex-direction:column;background:var(--term);border:1px solid var(--rule-2);border-radius:10px;overflow:hidden}
.ed-top{background:var(--text);color:var(--night);font:500 13px var(--f-mono);padding:4px 10px;display:flex;justify-content:space-between;gap:10px}
.ed-top span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed textarea{flex:1;resize:none;background:var(--term);color:var(--term-text);border:0;outline:0;padding:10px 12px;font:13.5px/1.5 var(--f-mono);tab-size:4}
.ed-status{min-height:24px;text-align:center;font:500 12.5px var(--f-mono);color:var(--night);padding:2px 8px}
.ed-status.show{background:var(--sodium)}
.ed-status.bad{background:var(--bad)}
.ed-keys{display:flex;gap:8px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--rule);font:12.5px var(--f-mono);color:var(--dim);align-items:center}
.ed-keys kbd{background:var(--text);color:var(--night);padding:0 4px;border-radius:3px;margin-right:4px}
.ed-keys .sp{flex:1}

.scrim{display:none}

@media (max-width:1180px){
  #app{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:"top top" "brief term"}
  .queue-btn{display:inline-block}
  .queue{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(330px,88vw);border-radius:0 12px 12px 0;transform:translateX(-105%);transition:transform .25s ease;
    padding-top:max(14px,env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
  body.qopen .queue{transform:none}
  body.qopen .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(3,6,12,.55)}
  .rank-next{display:none}
}
@media (max-width:860px){
  html,body{height:auto}
  #app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"top" "brief" "term"}
  .brief{overflow:visible}
  .brief-in{padding:18px 16px 26px}
  .term{height:min(600px,80vh)}
  .xpbar{width:90px}
  .brand small{display:none}
}
@media (max-width:480px){
  .rank{margin-left:0;width:100%}
  .xpbar{flex:1}
  .out,.inrow input{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header class="top">
    <button class="queue-btn" id="queueBtn" aria-controls="queue" aria-expanded="false">Tickets</button>
    <div class="brand"><b>Night<span>/</span>Shift</b><small>Halcyon Freight · Operations</small></div>
    <div class="shift" title="Shift clock"><span class="lamp" aria-hidden="true"></span><span id="clock">01:47</span> UTC</div>
    <div class="rank">
      <span class="rank-name" id="rankName">Intern</span>
      <div class="xpbar" role="progressbar" aria-label="Progress to next rank" id="xpbarWrap"><i id="xpFill"></i></div>
      <span class="xp" id="xpText">0 XP</span>
      <span class="rank-next" id="rankNext"></span>
    </div>
  </header>

  <nav class="queue" id="queue" aria-label="Ticket queue"></nav>
  <div class="scrim" id="scrim"></div>

  <main class="brief" id="brief"><div class="brief-in" id="briefIn"></div></main>

  <section class="term" aria-label="Terminal">
    <div class="term-bar">
      <span class="host" id="termHost">ops@hf-ws12</span>
      <button class="btn" id="hintBtn" type="button">Hint</button>
      <button class="btn" id="resetBtn" type="button">Reset lab</button>
    </div>
    <div class="out" id="out" role="log" aria-live="polite">
      <div id="lines"></div>
      <form class="inrow" id="cmdForm" autocomplete="off">
        <label for="cmd" id="prompt"></label>
        <input id="cmd" name="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Command">
      </form>
    </div>
  </section>
</div>

<div class="editor" id="editor" hidden>
  <div class="ed" role="dialog" aria-modal="true" aria-labelledby="edName">
    <div class="ed-top"><span>GNU nano 7.2</span><span id="edName"></span></div>
    <textarea id="edText" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="File contents"></textarea>
    <div class="ed-status" id="edStatus"></div>
    <div class="ed-keys">
      <span><kbd>^S</kbd>Save</span><span><kbd>^X</kbd>Exit</span><span class="sp"></span>
      <button class="btn primary" id="edSave" type="button">Save</button>
      <button class="btn" id="edClose" type="button">Exit</button>
    </div>
  </div>
</div>
